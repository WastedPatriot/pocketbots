name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-
      - name: tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          pip install pillow platformio
      - name: avatars match bots.json
        run: |
          python tools/png_to_c.py --check
          python tools/png_to_c.py --self-test
      - name: simulator
        working-directory: firmware
        run: |
          pio run -e sim
          ./.pio/build/sim/program run
      - name: esp32-s3
        working-directory: firmware
        run: pio run -e esp32s3
      - name: xiao v2
        working-directory: firmware
        run: pio run -e v2

  case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: openscad
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad -o /tmp/front.stl -D 'part="front"' enclosure/pocketbots.scad
          test -s /tmp/front.stl
