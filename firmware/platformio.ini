; pocketbots firmware.
;   pio run -e sim        host build, draws into a framebuffer
;   pio run -e esp32s3    Waveshare ESP32-S3-Touch-AMOLED-1.64 V1.1 (default)
;   pio run -e esp32s3-v1 the earlier board, CS on GPIO9, button-only wake

[platformio]
default_envs = sim

[env]
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
lib_deps = lvgl/lvgl@9.3.0

[env:sim]
platform = native
build_flags =
    ${env.build_flags}
    -DPOCKETBOTS_SIM=1
    -std=gnu++17
    -O2
build_src_filter = +<*> -<port_esp.cpp>
lib_ignore = esp_lcd_co5300

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<port_sim.cpp>
build_flags =
    ${env.build_flags}
    -DPOCKETBOTS_TARGET_ESP=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DESP_LCD_CO5300_VER_MAJOR=2
    -DESP_LCD_CO5300_VER_MINOR=2
    -DESP_LCD_CO5300_VER_PATCH=0
lib_deps =
    ${env.lib_deps}

[env:esp32s3-v1]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DPB_BOARD_V11=0
